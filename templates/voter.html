{% extends "base.html" %}
{% block title %}Tabernacle Survey{% endblock %}
{% block body_class %}voter{% endblock %}
{% block content %}
<header class="voter-header">
  <p class="voter-eyebrow" id="round-banner">Loading…</p>
</header>
<main id="single-item" class="single-item">
  <p class="loading">Loading…</p>
</main>
<template id="item-template">
  <article class="item">
    <h1 class="item-title"></h1>
    <figure class="item-figure">
      <img class="item-image" alt="">
    </figure>
    <section class="scripture-block">
      <p class="scripture-eyebrow">Described in Exodus</p>
      <p class="scripture-ref"></p>
      <blockquote class="scripture-text"></blockquote>
    </section>
    <section class="context-block" hidden>
      <p class="scripture-eyebrow context-eyebrow">What it represents</p>
      <p class="context-ref"></p>
      <blockquote class="context-text"></blockquote>
      <p class="meaning-line"></p>
    </section>
    <div class="rating-card">
      <p class="rating-prompt">How weird does this feel?</p>
      <div class="rating-row">
        <span>1 — totally normal</span>
        <span>5 — what on earth</span>
      </div>
      <div class="rating-buttons" role="radiogroup" aria-label="weirdness rating">
        <button type="button" class="rating-btn" data-rating="1">1</button>
        <button type="button" class="rating-btn" data-rating="2">2</button>
        <button type="button" class="rating-btn" data-rating="3">3</button>
        <button type="button" class="rating-btn" data-rating="4">4</button>
        <button type="button" class="rating-btn" data-rating="5">5</button>
      </div>
      <p class="vote-status" hidden></p>
    </div>
    <div class="voting-closed-card" hidden>
      <p class="closed-headline">Voting closed for this one.</p>
      <p class="closed-hint">Look at the screen. Discuss.</p>
    </div>
  </article>
</template>
<template id="done-template">
  <div class="done-msg">
    <h2>That's all of them.</h2>
    <p>Thanks for voting. Look at the screen.</p>
  </div>
</template>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/voter.js') }}"></script>
{% endblock %}
